# Standalone test environment; never enables DHCP on the host/LAN.
name: heimdal-pxe-lab
services:
  pxe-test:
    image: heimdal-bare-metal-adapter-pxe-test:latest
    build:
      context: .
      dockerfile: tools/pxe-test/Dockerfile
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - .:/src:ro
      - ./artifacts/pxe-test:/output
    mem_limit: 2g
    cpus: 2
