  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" class="title">Heimdal Bare-Metal Adapter</text>
  <text x="800" y="80" text-anchor="middle" class="subtitle">Self-hosted platform for ISO wrapping, golden images, and bare-metal deployment through Heimdal PXE</text>
  <rect x="1220" y="20" rx="12" ry="12" width="340" height="120" class="box2"/>
  <text x="1390" y="48" text-anchor="middle" class="cap">ARCHITECTURAL PRINCIPLE</text>
  <text x="1390" y="78" text-anchor="middle" class="h2">Control plane in VM.</text>
  <text x="1390" y="103" text-anchor="middle" class="h2">Large media stays on external storage.</text>
