  <rect x="980" y="350" width="36" height="48" fill="#fff" stroke="#7b4fc9" stroke-width="1.5"/><text x="998" y="380" text-anchor="middle" class="small">PXE</text>
  <rect x="1045" y="350" width="36" height="48" fill="#fff" stroke="#7b4fc9" stroke-width="1.5"/><text x="1063" y="380" text-anchor="middle" class="small">PXE</text>
