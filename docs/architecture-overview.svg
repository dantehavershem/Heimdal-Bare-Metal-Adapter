  <text x="1425" y="270" text-anchor="middle" class="h1" fill="#0f766e">Bare-Metal Endpoints</text>
  <rect x="1315" y="300" rx="10" ry="10" width="220" height="62" class="white" stroke="#97d6d6" stroke-width="1.2"/><text x="1425" y="338" text-anchor="middle" class="text">Physical PCs</text>
  <rect x="1315" y="368" rx="10" ry="10" width="220" height="62" class="white" stroke="#97d6d6" stroke-width="1.2"/><text x="1425" y="406" text-anchor="middle" class="text">Servers</text>
  <rect x="1315" y="436" rx="10" ry="10" width="220" height="62" class="white" stroke="#97d6d6" stroke-width="1.2"/><text x="1425" y="474" text-anchor="middle" class="text">Reference Machines</text>
  <path d="M1192 320 L1289 320" class="arrowPurple"/><text x="1240" y="305" text-anchor="middle" class="text" fill="#6f42c1">PXE boot</text>
