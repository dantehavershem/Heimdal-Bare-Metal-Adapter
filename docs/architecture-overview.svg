  <rect x="488" y="248" rx="8" ry="8" width="140" height="48" class="white" stroke="#8aa4d8" stroke-width="1.2"/><text x="558" y="278" text-anchor="middle" class="text">REST API</text>
  <rect x="338" y="306" rx="8" ry="8" width="140" height="48" class="white" stroke="#8aa4d8" stroke-width="1.2"/><text x="408" y="336" text-anchor="middle" class="text">PostgreSQL</text>
  <rect x="488" y="306" rx="8" ry="8" width="140" height="48" class="white" stroke="#8aa4d8" stroke-width="1.2"/><text x="558" y="336" text-anchor="middle" class="text">Redis</text>
