  <path d="M965 690 L1400 690 L1400 528" class="dashTeal"/><text x="1248" y="666" text-anchor="middle" class="text">Image / Installer data path</text>
  <rect x="25" y="820" rx="12" ry="12" width="1550" height="60" class="band"/>
  <text x="95" y="857" text-anchor="middle" class="h2">Platform</text><text x="95" y="875" text-anchor="middle" class="h2">Capabilities</text>
  <text x="250" y="857" text-anchor="middle" class="text">ISO Analysis</text><text x="430" y="857" text-anchor="middle" class="text">Adapter Engine</text><text x="635" y="857" text-anchor="middle" class="text">Installer Capsules</text><text x="855" y="857" text-anchor="middle" class="text">Golden Image Capture</text><text x="1075" y="857" text-anchor="middle" class="text">Golden Image Deploy</text><text x="1280" y="857" text-anchor="middle" class="text">Driver Matching</text><text x="1470" y="857" text-anchor="middle" class="text">Future PXE Publishing</text>
