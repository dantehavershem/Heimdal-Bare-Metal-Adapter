<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 30px Arial,Helvetica,sans-serif; fill:#13315c}
      .subtitle{font:400 16px Arial,Helvetica,sans-serif; fill:#334e68}
      .h1{font:700 18px Arial,Helvetica,sans-serif; fill:#1f3c88}
      .h2{font:700 15px Arial,Helvetica,sans-serif; fill:#1f3c88}
      .text{font:400 14px Arial,Helvetica,sans-serif; fill:#243b53}
      .small{font:400 12px Arial,Helvetica,sans-serif; fill:#486581}
      .cap{font:700 14px Arial,Helvetica,sans-serif; fill:#0f4c5c}
      .white{fill:#fff}
      .box{fill:#f8fbff;stroke:#2f5fb3;stroke-width:2}
      .box2{fill:#ffffff;stroke:#8aa4d8;stroke-width:1.5}
      .storage{fill:#f5fbfb;stroke:#1f9d9d;stroke-width:2}
      .storage2{fill:#ffffff;stroke:#78c2c4;stroke-width:1.5}
      .pxe{fill:#fbf8ff;stroke:#7b4fc9;stroke-width:2}
      .endpoint{fill:#f7fbfb;stroke:#1b9aaa;stroke-width:2}
      .band{fill:#f7faff;stroke:#9ab1d6;stroke-width:1.5}
      .arrowBlue{stroke:#2f5fb3;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}
      .arrowPurple{stroke:#7b4fc9;stroke-width:3;fill:none;marker-end:url(#arrowPurple)}
      .dashTeal{stroke:#1b9aaa;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#arrowTeal)}
      .dashBlue{stroke:#2f5fb3;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#arrowBlue)}
      .dashBoth{stroke:#1b9aaa;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-start:url(#arrowTealStart);marker-end:url(#arrowTeal)}
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#2f5fb3"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#1b9aaa"/></marker>
    <marker id="arrowTealStart" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><polygon points="10 0, 0 3, 10 6" fill="#1b9aaa"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#7b4fc9"/></marker>
